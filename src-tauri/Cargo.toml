[package]
name = "md-reader-app"
version = "0.1.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "md_reader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Module IA optionnel : activé dans les builds officiels, désactivable avec
# `--no-default-features` (les commandes renvoient alors `unsupported`).
default = ["ai"]
ai = ["dep:reqwest", "dep:futures-util", "dep:keyring", "dep:sysinfo", "dep:uuid"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
pulldown-cmark = "0.13.3"
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros", "rt"] }
reqwest = { version = "0.13", features = ["json", "stream"], optional = true }
futures-util = { version = "0.3", optional = true }
keyring = { version = "3", features = ["windows-native"], optional = true }
sysinfo = { version = "0.33", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.38"
windows-pdf = { package = "windows", version = "0.61", features = [
    "Win32_Foundation",
] }
